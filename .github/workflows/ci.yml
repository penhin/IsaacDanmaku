name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lua-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Run domain tests
        run: lua5.3 tests/run.lua
      - name: Validate Workshop payload
        run: |
          test -f mod/isaac_danmaku/main.lua
          test -f mod/isaac_danmaku/metadata.xml
          test -f mod/isaac_danmaku/resources/font/isaac_danmaku_zh.fnt
          test -f mod/isaac_danmaku/resources/font/isaac_danmaku_zh_0.png
          test -f mod/isaac_danmaku/resources/font/OFL.txt
          ! grep -R -E "(socket|http|vision|capture|Sidecar)" mod/isaac_danmaku --include='*.lua'
